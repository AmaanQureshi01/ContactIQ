<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="binderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="50%" stop-color="#0080ff" />
      <stop offset="100%" stop-color="#3b0086" />
    </linearGradient>

    <!-- Glowing Pink-Cyan for CIQ -->
    <linearGradient id="ciqGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
  </defs>

  <!-- Squircle App Badge -->
  <rect x="8" y="4" width="52" height="56" rx="14" fill="url(#binderGrad)" stroke="#38bdf8" stroke-width="1.2" />

  <!-- Left Spiral Rings -->
  <g stroke="#e2e8f0" stroke-width="2.5" stroke-linecap="round">
    <line x1="4" y1="16" x2="12" y2="16" />
    <line x1="4" y1="26" x2="12" y2="26" />
    <line x1="4" y1="36" x2="12" y2="36" />
    <line x1="4" y1="46" x2="12" y2="46" />
  </g>

  <!-- Background Tech Network Nodes (Subtle Connectivity) -->
  <g stroke="#38bdf8" stroke-width="0.8" opacity="0.6">
    <line x1="40" y1="18" x2="52" y2="20" />
    <line x1="52" y1="20" x2="48" y2="34" />
    <line x1="48" y1="34" x2="42" y2="48" />
  </g>
  <circle cx="40" cy="18" r="1.5" fill="#38bdf8" opacity="0.8" />
  <circle cx="52" cy="20" r="2" fill="#38bdf8" opacity="0.9" />
  <circle cx="48" cy="34" r="1.8" fill="#2dd4bf" opacity="0.8" />
  <circle cx="42" cy="48" r="2" fill="#f472b6" opacity="0.9" />

  <!-- CIQ Typography -->
  <text x="34" y="39" text-anchor="middle" font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, sans-serif" font-size="18" font-weight="900" letter-spacing="-0.5px" fill="url(#ciqGlow)" stroke="#0f172a" stroke-width="0.6">CIQ</text>
</svg>