<!DOCTYPE html>
<html lang="en" th:replace="~{base :: parent(~{::section},~{::title})}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>
</head>

<body>
    <section>
        <!-- Grid Columns 12  -->
        <div class="grid grid-cols-12">
            <!-- 12 Me SE 6 ki space ye niche wala div lega -->
            <div class="col-span-4 md:col-span-3 lg:col-span-4"></div>
            <div class="col-span-12 md:col-span-8 lg:col-span-4">
                <div
                    class="bg-neutral-primary-soft block p-6 border-t-4 border-blue-700 rounded-base shadow-xs hover:bg-neutral-secondary-medium">
                    <div th:replace="~{message::messageBox}"></div>
                    <h5 class="mb-3 text-2xl font-semibold tracking-tight text-heading leading-8 text-center">Create
                        Your Account</h5>
                    <p class="text-body text-sm text-center"> Join professionals who rely on intelligent contact
                        management.</p>
                    <form th:action="@{'/do-signup'}" method="post" class="mt-5" th:object="${userForm}" novalidate>
                        <!-- name -->
                         <div class="mb-5">
                            <label for="name" 
                            class="block mb-2.5 text-sm font-medium text-heading"
                            >Name</label>
                            <input type="text" id="name" th:field="*{name}"
                                class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-full px-3 py-2.5 shadow-xs placeholder:text-body"
                                placeholder="Enter your name" required />

                             <p th:if="${#fields.hasErrors('name')}" class="text-red-600 px-1 py-2 font-normal" th:errors="*{name}"></p>
                        </div>
                         <!-- email -->
                        <div class="mb-5">
                            <label for="email" 
                            class="block mb-2.5 text-sm font-medium text-heading"
                            >Your email</label>
                            <input type="email" id="email" th:field="*{email}"
                                class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-full px-3 py-2.5 shadow-xs placeholder:text-body"
                                placeholder="name@gmail.com" required />
                            <p th:if="${#fields.hasErrors('email')}" class="text-red-600 px-1 py-2 font-normal" th:errors="*{email}"></p>
                        </div>
                        <!-- password -->
                        <div class="mb-5">
                            <label for="password" 
                            class="block mb-2.5 text-sm font-medium text-heading"
                            >Password</label>
                            <input type="password" id="password" th:field="*{password}"
                                class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-full px-3 py-2.5 shadow-xs placeholder:text-body"
                                placeholder="Enter your password" required />

                            <p th:if="${#fields.hasErrors('password')}" class="text-red-600 px-1 py-2 font-normal" th:errors="*{password}"></p>
                        </div>
                        <!-- Phone Number -->
                        <div class="mb-5">
                            <label for="phoneNumber" 
                            class="block mb-2.5 text-sm font-medium text-heading"
                            >Contact Number</label>
                            <input type="tel" id="phoneNumber" th:field="*{phoneNumber}"
                                class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-full px-3 py-2.5 shadow-xs placeholder:text-body"
                                placeholder="+1 234 567 890" required />

                            <p th:if="${#fields.hasErrors('phoneNumber')}" class="text-red-600 px-1 py-2 font-normal" th:errors="*{phoneNumber}"></p>
                        </div>
                        <!-- About -->
                        <div class="mb-5">
                            <label for="about" 
                            class="block mb-2.5 text-sm font-medium text-heading"
                            >About</label>
                            <textarea id="about" rows="4" th:field="*{about}"
                                class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-full px-3 py-2.5 shadow-xs placeholder:text-body"
                                placeholder="Write something about yourself..."></textarea>
                        </div>

                        <!-- Button -->
                         <div class="mb-5 flex justify-center space-x-3">
                             <button type="submit"
                                 class="bg-blue-600 hover:bg-blue-800 dark:bg-slate-500 dark:hover:bg-slate-700 text-white px-3 py-2 rounded">
                                 Sign Up
                             </button>
                             <button type="reset"
                                 class="bg-orange-600 hover:bg-orange-900 text-white px-3 py-2 rounded">
                                 Reset
                             </button>
                         </div>
                    </form>
                </div>
            </div>
        </div>

    </section>
</body>

</html>
