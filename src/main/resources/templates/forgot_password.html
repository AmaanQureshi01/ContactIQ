<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="stylesheet" th:href="@{'/css/output.css'}">
</head>
<body class="bg-gray-50 dark:bg-slate-900 min-h-screen flex items-center justify-center p-4">

<div class="w-full max-w-md bg-white dark:bg-slate-800 border border-gray-200 dark:border-slate-700 rounded-xl shadow-sm p-6 sm:p-8">
    <div class="mb-6">
        <h2 class="text-2xl font-bold text-gray-900 dark:text-white">Forgot Password</h2>
        <p class="mt-1 text-sm text-gray-600 dark:text-gray-400">
            Enter your registered email address and we'll send you a magic link to reset your password.
        </p>
    </div>

    <!-- Flash Messages -->
    <div th:if="${errorMessage}" class="mb-4 p-3 text-sm text-red-700 bg-red-100 dark:bg-red-900/40 dark:text-red-300 rounded-lg" th:text="${errorMessage}"></div>
    <div th:if="${successMessage}" class="mb-4 p-3 text-sm text-green-700 bg-green-100 dark:bg-green-900/40 dark:text-green-300 rounded-lg" th:text="${successMessage}"></div>

    <form th:action="@{'/forgot-password'}" method="post" class="space-y-4">
        <div>
            <label for="email" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Email Address</label>
            <input
                    id="email"
                    name="email"
                    type="email"
                    th:value="${prefilledEmail}"
                    placeholder="name@example.com"
                    required
                    class="w-full h-10 px-3 text-sm bg-gray-50 dark:bg-slate-700 border border-gray-300 dark:border-slate-600 rounded-lg text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none"
            >
        </div>

        <button
                type="submit"
                class="w-full h-10 px-4 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-lg transition cursor-pointer"
        >
            Send Reset Link
        </button>
    </form>

    <div class="mt-6 text-center">
        <a th:if="${prefilledEmail != null}" th:href="@{'/user/profile'(edit=true)}" class="text-sm font-medium text-blue-600 hover:underline dark:text-blue-400">
            Back to Profile
        </a>
        <a th:if="${prefilledEmail == null}" th:href="@{'/login'}" class="text-sm font-medium text-blue-600 hover:underline dark:text-blue-400">
            Back to Login
        </a>
    </div>
</div>

</body>
</html>
