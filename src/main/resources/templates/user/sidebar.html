<div th:fragment="sidebar(content)">
  <nav class="fixed top-0 z-50 w-full bg-neutral-primary-soft border-b border-default">
    <div class="px-3 py-3 lg:px-5 lg:pl-3">
      <div class="flex items-center justify-between">
        <div class="flex items-center justify-start rtl:justify-end">
          <button data-drawer-target="top-bar-sidebar" data-drawer-toggle="top-bar-sidebar"
            aria-controls="top-bar-sidebar" type="button"
            class="sm:hidden text-heading bg-transparent box-border border border-transparent hover:bg-neutral-secondary-medium focus:ring-4 focus:ring-neutral-tertiary font-medium leading-5 rounded-base text-sm p-2 focus:outline-none">
            <span class="sr-only">Open sidebar</span>
            <svg class="w-6 h-6" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
              fill="none" viewBox="0 0 24 24">
              <path stroke="currentColor" stroke-linecap="round" stroke-width="2" d="M5 7h14M5 12h14M5 17h10" />
            </svg>
          </button>
          <a th:href="@{'/user/dashboard'}" class="flex ms-2 md:me-24">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"
              class="w-10 h-10 transition-transform duration-300 hover:scale-105" fill="none">
              <!-- Background Badge (Optional squircle) -->
              <rect width="64" height="64" rx="14"
                class="fill-slate-100 dark:fill-slate-900 transition-colors duration-300" />

              <!-- Binder Spine (Left Side) -->
              <path d="M12 12C12 9.79086 13.7909 8 16 8H22V56H16C13.7909 56 12 54.2091 12 52V12Z"
                class="fill-blue-600 dark:fill-cyan-500 transition-colors duration-300" />

              <!-- Binder Main Body -->
              <rect x="22" y="8" width="30" height="48" rx="4"
                class="fill-slate-200 stroke-blue-600 dark:fill-slate-800 dark:stroke-cyan-400 stroke-2 transition-colors duration-300" />

              <!-- Spiral Rings -->
              <g class="stroke-slate-400 dark:stroke-cyan-200 stroke-2 transition-colors duration-300">
                <line x1="10" y1="18" x2="16" y2="18" stroke-linecap="round" />
                <line x1="10" y1="32" x2="16" y2="32" stroke-linecap="round" />
                <line x1="10" y1="46" x2="16" y2="46" stroke-linecap="round" />
              </g>

              <!-- Side Index Tabs -->
              <rect x="52" y="16" width="3" height="6" rx="1.5" class="fill-teal-500 dark:fill-cyan-400" />
              <rect x="52" y="26" width="3" height="6" rx="1.5" class="fill-emerald-500 dark:fill-teal-300" />
              <rect x="52" y="36" width="3" height="6" rx="1.5" class="fill-slate-300 dark:fill-slate-600" />

              <!-- Contact Avatar: Head -->
              <circle cx="37" cy="26" r="6" class="fill-teal-600 dark:fill-cyan-300 transition-colors duration-300" />

              <!-- Contact Avatar: Body -->
              <path d="M27 44C27 38.4772 31.4772 34 37 34C42.5228 34 47 38.4772 47 44"
                class="stroke-teal-600 dark:stroke-cyan-300 stroke-[3] stroke-linecap-round transition-colors duration-300" />
            </svg><span class="mx-2 text-xl flex flex-row font-bold tracking-tight text-slate-800 dark:text-slate-100">
              <!-- IQ is shyning in pink and cyan color-->
              Contact<span
                class=" dark:text-pink-400 font-extrabold tracking-wider bg-linear-to-r from-[#38bdf8] to-[#2dd4bf] bg-clip-text text-transparent drop-shadow-[0_0_8px_rgba(56,189,248,0.6)]">IQ</span>
            </span>
          </a>
        </div>
        <div class="flex items-center">
          <div class="flex items-center ms-3">
            <!-- 2. RIGHT: Theme Toggle + Desktop CTA + Hamburger Button -->
            <div class="flex items-center gap-2 md:order-12">
              <!-- Theme Toggle -->
              <button id="theme-toggle" type="button"
                class="p-2 rounded-lg text-gray-500 hover:text-gray-900 dark:text-gray-400 dark:hover:text-white hover:bg-gray-100 dark:hover:bg-slate-800 focus:outline-none transition"
                aria-label="Toggle Theme">
                <svg id="theme-toggle-light-icon" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                  <path
                    d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z"
                    fill-rule="evenodd" clip-rule="evenodd"></path>
                </svg>
                <svg id="theme-toggle-dark-icon" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                  <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path>
                </svg>
              </button>
              <div>
                <button type="button"
                  class="flex text-sm bg-gray-800 rounded-full focus:ring-4 focus:ring-gray-300 dark:focus:ring-gray-600"
                  aria-expanded="false" data-dropdown-toggle="dropdown-user">
                  <span class="sr-only">Open user menu</span>
                  <img class="w-8 h-8 rounded-full" th:src="${loggedInUser.profilePicture}" alt="user photo">
                </button>
              </div>
              <div
                class="z-50 hidden bg-neutral-primary-medium border border-default-medium rounded-base shadow-lg w-44"
                id="dropdown-user">
                <div class="px-4 py-3 border-b border-default-medium" role="none">
                  <p class="text-sm font-medium text-heading" role="none" th:text="${loggedInUser.name}">
                  </p>
                  <p class="text-sm text-body truncate" role="none" th:text="${loggedInUser.email}">

                  </p>
                </div>
                <ul class="p-2 text-sm text-body font-medium" role="none">
                  <li>
                    <a th:href="@{'/user/dashboard'}"
                      class="inline-flex items-center w-full p-2 hover:bg-neutral-tertiary-medium hover:text-heading rounded"
                      role="menuitem">Dashboard</a>
                  </li>
                  <li>
                    <a th:href="@{'/user/profile'}"
                      class="inline-flex items-center w-full p-2 hover:bg-neutral-tertiary-medium hover:text-heading rounded"
                      role="menuitem">Profile</a>
                  </li>
                  <li>
                    <!-- <a href="#" class="inline-flex items-center w-full p-2 hover:bg-neutral-tertiary-medium hover:text-heading rounded" role="menuitem">Earnings</a> -->
                  </li>
                  <li>
                    <a th:href="@{'/logout'}"
                      class="inline-flex items-center w-full p-2 hover:bg-neutral-tertiary-medium hover:text-heading rounded"
                      role="menuitem">Sign out</a>
                  </li>
                </ul>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <div class="p-4 sm:ml-64 mt-14">
