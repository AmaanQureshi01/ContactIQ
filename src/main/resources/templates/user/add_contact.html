<!DOCTYPE html>
<html lang="en" th:replace="~{user/user_base :: parent(~{::section},~{::title})}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${loggedInUser.name} +' | Add Contact'"></title>
</head>

<body>
    <section>
        <div class="grid grid-cols-10">
            <div class="col-span-2"></div>
            <div class="col-span-12 md:col-span-6">
                <div class="bg-neutral-primary-soft block p-6 border border-default rounded-base shadow-xs">
                    <h1 class="text-2xl font-semibold text-center">Add New Contact</h1>
                    <p class="text-gray-600 text-sm dark:text-gray-400 text-center">This contact will be store in
                        cloud.</p>
                    <div class="mb-5">
                        <div th:replace="~{message :: messageBox}"></div>
                    </div>
                    <form class="mt-10" th:action="@{'/user/contacts/add'}" method="post" th:object="${contactForm}" enctype="multipart/form-data">
                        <!-- Name -->
                        <label for="name" class="block mb-2.5 text-sm font-medium text-heading">Username</label>
                        <div class="flex shadow-xs rounded-base mb-3">
                            <span
                                    class="inline-flex items-center px-3 text-sm text-body bg-neutral-tertiary border rounded-e-0 border-default-medium border-e-0 rounded-s-base">
                                <svg class="w-4 h-4 text-body" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
                                     width="24" height="24" fill="none" viewBox="0 0 24 24">
                                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                                          stroke-width="2"
                                          d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Zm0 0a8.949 8.949 0 0 0 4.951-1.488A3.987 3.987 0 0 0 13 16h-2a3.987 3.987 0 0 0-3.951 3.512A8.948 8.948 0 0 0 12 21Zm3-11a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                                </svg>
                            </span>
                            <input type="text" id="name" th:field="*{name}"
                                   class="rounded-none rounded-e-base block w-full px-3 py-2.5 bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand placeholder:text-body"
                                   placeholder="name">
                        </div>
                            <p th:if="${#fields.hasErrors('name')}" class="text-red-600 px-1 py-2 font-normal" th:errors="*{name}"></p>
<!--                       Email-->
                        <label for="email" class="block mb-2.5 text-sm font-medium text-heading">Email</label>
                        <div class="flex shadow-xs rounded-base mb-3">
                        <span
                                class="inline-flex items-center px-3 text-sm text-body bg-neutral-tertiary border rounded-e-0 border-default-medium border-e-0 rounded-s-base">
                            <svg class="w-4 h-4 text-body" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
                                 width="24" height="24" fill="none" viewBox="0 0 24 24">
                                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                                      stroke-width="2"
                                      d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75" />
                            </svg>
                        </span>
                            <input type="text" id="email" th:field="*{email}"
                                   class="rounded-none rounded-e-base block w-full px-3 py-2.5 bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand placeholder:text-body"
                                   placeholder="name@gmail.com">
                        </div>
                        <p th:if="${#fields.hasErrors('email')}" class="text-red-600 px-1 py-2 font-normal" th:errors="*{email}"></p>
                        <!-- Phone Number -->
                        <label for="phone" class="block mb-2.5 text-sm font-medium text-heading">Phone Number</label>
                        <div class="flex shadow-xs rounded-base mb-3">
                        <span
                                class="inline-flex items-center px-3 text-sm text-body bg-neutral-tertiary border rounded-e-0 border-default-medium border-e-0 rounded-s-base">
                            <svg class="w-4 h-4 text-body" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
                                 width="24" height="24" fill="none" viewBox="0 0 24 24">
                                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                                      stroke-width="2"
                                      d="M18.427 14.768 17.2 13.542a1.733 1.733 0 0 0-2.45 0l-.613.613a1.732 1.732 0 0 1-2.45 0l-1.84-1.84a1.732 1.732 0 0 1 0-2.45l.613-.613a1.733 1.733 0 0 0 0-2.45L9.234 5.575a1.732 1.732 0 0 0-2.45 0l-.964.964c-.878.877-1.129 2.222-.628 3.376 1.734 3.992 4.881 7.14 8.874 8.874 1.154.501 2.499.25 3.376-.628l.985-.983a1.732 1.732 0 0 0 0-2.41Z" />
                            </svg>
                        </span>
                            <input type="text" id="phone" th:field="*{phone}"
                                   class="rounded-none rounded-e-base block w-full px-3 py-2.5 bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand placeholder:text-body"
                                   placeholder="+91 0123456789">
                        </div>
                        <p th:if="${#fields.hasErrors('phone')}" class="text-red-600 px-1 py-2 font-normal" th:errors="*{phone}"></p>

<!--                        Address-->
                        <label for="address" class="block mb-2.5 text-sm font-medium text-heading">Address</label>
                        <div class="flex shadow-xs rounded-base mb-3">
                        <span
                                class="inline-flex items-center px-3 text-sm text-body bg-neutral-tertiary border rounded-e-0 border-default-medium border-e-0 rounded-s-base">
                            <svg class="w-4 h-4 text-body" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
                                 width="24" height="24" fill="none" viewBox="0 0 24 24">
                                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                                      stroke-width="2"
                                      d="M12 13a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" />
                                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                                      stroke-width="2"
                                      d="M17.8 13.938 12 20.5l-5.8-6.562A7.8 7.8 0 0 1 4.2 8.7C4.2 4.448 7.693 1 12 1s7.8 3.448 7.8 7.7a7.8 7.8 0 0 1-2 5.238Z" />
                            </svg>
                        </span>
                            <textarea
                                    id="address"
                                    name="address"
                                    th:field="*{address}"
                                    rows="3"
                                    class="rounded-none rounded-e-base block w-full px-3 py-2.5 bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand placeholder:text-body"
                                    placeholder="123 Street, City, Country..."></textarea>
                        </div>

<!--                        ABOUT-->
                        <label for="description" class="block mb-2.5 text-sm font-medium text-heading">Description</label>
                        <div class="flex shadow-xs rounded-base mb-3">
                        <span
                                class="inline-flex items-center px-3 text-sm text-body bg-neutral-tertiary border rounded-e-0 border-default-medium border-e-0 rounded-s-base">
                            <svg class="w-4 h-4 text-body" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
                                 width="24" height="24" fill="none" viewBox="0 0 24 24">
                                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                                      stroke-width="2"
                                      d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z" />
                            </svg>
                        </span>
                            <textarea
                                    id="description"
                                    name="description"
                                    th:field="*{description}"
                                    rows="3"
                                    class="rounded-none rounded-e-base block w-full px-3 py-2.5 bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand placeholder:text-body"
                                    placeholder="Write Something About this Contact..."></textarea>
                        </div>

<!--                        Social Links -->
                        <h3 class="block mb-2.5 text-sm font-medium text-heading">Social Links</h3>
                        <div class="md:flex space-x-3 mb-3 sm:flex sm:flex-row">
                            <div class="w-full">

                                <div class="flex shadow-xs rounded-base mb-3">
                                    <span
                                            class="inline-flex items-center px-3 text-sm text-body bg-neutral-tertiary border rounded-e-0 border-default-medium border-e-0 rounded-s-base">
                                        <svg class="w-4 h-4 text-body" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
                                             width="24" height="24" fill="none" viewBox="0 0 24 24">
                                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                                  d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Zm0 0c2.5 0 4.5-4.03 4.5-9S14.5 3 12 3m0 18c-2.5 0-4.5-4.03-4.5-9S9.5 3 12 3m-8.5 9h17" />
                                        </svg>
                                    </span>
                                    <input type="text" id="socialLinks1" th:field="*{socialLinks1}"
                                           class="rounded-none rounded-e-base block w-full px-3 py-2.5 bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand placeholder:text-body"
                                           placeholder="https://example.com">
                                </div>
                            </div>
                            <div class="w-full">
                                <div class="flex shadow-xs rounded-base mb-3">
                                    <span
                                            class="inline-flex items-center px-3 text-sm text-body bg-neutral-tertiary border rounded-e-0 border-default-medium border-e-0 rounded-s-base">
                                        <svg class="w-4 h-4 text-body" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
                                             width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
                                            <path fill-rule="evenodd" clip-rule="evenodd"
                                                  d="M12.51 8.796v1.697a3.738 3.738 0 0 1 3.288-1.752c3.455 0 4.202 2.16 4.202 5.333V21h-3.508v-6.198c0-1.635-.615-2.58-1.92-2.58-1.455 0-2.235 1.03-2.235 2.58V21h-3.508V8.796h3.683ZM4.015 8.796V21h3.508V8.796H4.015ZM5.77 3a2.023 2.023 0 1 0 0 4.047 2.023 2.023 0 0 0 0-4.047Z" />
                                        </svg>
                                    </span>
                                    <input type="text" id="linkdin" th:field="*{linkdin}"
                                           class="rounded-none rounded-e-base block w-full px-3 py-2.5 bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand placeholder:text-body"
                                           placeholder="https://example.com">
                                </div>
                            </div>
                        </div>

<!--                        Profile Picture-->
                        <div class="mb-5">
                            <label class="block mb-2.5 text-sm font-medium text-heading" for="image_file_input">Profile Picture</label>
                            <input id="image_file_input" class="cursor-pointer bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-full shadow-xs placeholder:text-body" type="file" th:field="*{contactImage}">
                            <img src="" id="upload_image_preview" alt="" class="max-h-50 mx-auto rounded-lg shadow-2xl mt-5">
                        </div>

<!--                        Favorite -->
                        <div class="flex items-center mb-5">
                            <input id="favorite" type="checkbox" value="" class="w-4 h-4 border bg-gray-300 border-b-gray-400 dark:border-default-medium rounded-xs dark:bg-neutral-secondary-medium focus:ring-2 focus:ring-brand-soft" th:field="*{favorite}">
                            <label for="favorite" class="select-none ms-2 text-sm font-medium text-heading">Is this contact your favourite one?</label>
                        </div>
<!--                        Buttons-->
                        <div class="mb-3 flex justify-center space-x-3">
                            <button type="submit"
                                    class="bg-blue-600 hover:bg-blue-800 dark:bg-slate-500 dark:hover:bg-slate-700 text-white px-3 py-2 rounded">
                                Add Contact
                            </button>
                            <button type="reset"
                                    class="bg-orange-600 hover:bg-orange-900 text-white px-3 py-2 rounded">
                                Reset
                            </button>
                        </div>
                    </form>

                </div>

            </div>
        </div>

        <script th:src="@{'/js/admin.js'}"></script>

    </section>

</body>

</html>
