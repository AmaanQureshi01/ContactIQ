<!DOCTYPE html>
<html lang="en" th:fragment="parent(content, title)" xmlns:th="https://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/output.css}" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="icon" type="image/svg+xml" th:href="@{/image/favicon.svg}" />
    <title th:replace="${title}"></title>
</head>
<body class="bg-white text-gray-900 dark:bg-slate-950 dark:text-gray-100 min-h-screen transition-colors duration-200">



<!-- User Sidebar -->
<div th:if="${loggedInUser}">
    <div th:replace="~{user/sidebar :: sidebar(${content})}"></div>
</div>
<!--    <script src="../path/to/flowbite/dist/flowbite.min.js"></script>-->
<script src="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.js"></script>
<script th:src="@{'/js/script.js'}"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
    const toggleBtn = document.getElementById('theme-toggle');
    const htmlElement = document.documentElement;

    // Grab the icon elements inside your button (if present)
    const lightIcon = document.getElementById('theme-toggle-light-icon');
    const darkIcon = document.getElementById('theme-toggle-dark-icon');

    // Helper function to keep button icons in sync with the current theme
    function updateIcons(isDark) {
        if (!lightIcon || !darkIcon) return;
        if (isDark) {
            lightIcon.classList.remove('hidden');
            darkIcon.classList.add('hidden');
        } else {
            lightIcon.classList.add('hidden');
            darkIcon.classList.remove('hidden');
        }
    }

    // 1. Check preference on load
    // Prioritize manual toggle preference; defaults to light mode so OS dark theme doesn't force white text
    if (localStorage.getItem('theme') === 'dark') {
        htmlElement.classList.add('dark');
        updateIcons(true);
    } else {
        htmlElement.classList.remove('dark');
        updateIcons(false);
    }

    // 2. Toggle click handler
    if (toggleBtn) {
        toggleBtn.addEventListener('click', (e) => {
            e.preventDefault();

            if (htmlElement.classList.contains('dark')) {
                htmlElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
                updateIcons(false);
                console.log("Switched to Light mode");
            } else {
                htmlElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
                updateIcons(true);
                console.log("Switched to Dark mode");
            }
        });
    }
</script>
<script>
    // Mobile Hamburger Toggle
    const menuBtn = document.getElementById('mobile-menu-toggle');
    const mobileMenu = document.getElementById('mobile-menu');

    if (menuBtn && mobileMenu) {
        menuBtn.addEventListener('click', () => {
            mobileMenu.classList.toggle('hidden');
            const expanded = menuBtn.getAttribute('aria-expanded') === 'true' || false;
            menuBtn.setAttribute('aria-expanded', !expanded);
        });
    }
</script>
<script>
    function toggleDropdown(button) {
        const menu = button.nextElementSibling;
        // Baki open dropdowns band karein
        document.querySelectorAll('.dropdown-menu').forEach(m => {
            if (m !== menu) m.classList.add('hidden');
        });
        menu.classList.toggle('hidden');
    }

    // Bahar click karne par band karein
    window.addEventListener('click', function(e) {
        if (!e.target.closest('button')) {
            document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.add('hidden'));
        }
    });
</script>
</body>

</html>
