<!DOCTYPE html>
<html lang="en" th:replace="~{user/user_base :: parent(~{::section},~{::title})}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${loggedInUser.name} +' | Search'"></title>
</head>
<body>
<section>
    <div class="flex justify-center flex-col items-center">
        <h1 class="text-2xl font-bold">Search Contacts</h1>
        <p class="text-sm text-body" th:text="${contactList.totalElements}+' results found'"></p>
    </div>

    <div class="contacts_container p-5 ">
        <div th:replace="~{message :: messageBox}"></div>
        <div class="relative overflow-x-auto bg-neutral-primary-soft shadow-xs rounded-base border border-default">
            <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 p-4">
                <!-- Search Form -->
                <form th:action="@{'/user/contacts/search'}" method="get" class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3 w-full md:w-auto">

                    <!-- Field Select -->
                    <div class="w-full sm:w-44">
                        <label for="search-field" class="sr-only">Select Field</label>
                        <select id="search-field" name="field" class="block w-full h-10 px-3 bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-lg focus:ring-brand focus:border-brand shadow-xs">
                            <option value="" selected disabled>Select Field</option>
                            <option value="name">Name</option>
                            <option value="email">Email</option>
                            <option value="phone">Phone</option>
                        </select>
                    </div>

                    <!-- Search Input -->
                    <div class="relative w-full sm:w-64 md:w-72">
                        <label for="search-keyword" class="sr-only">Search</label>
                        <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
                            <svg class="w-4 h-4 text-body" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m21 21-3.5-3.5M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z"/>
                            </svg>
                        </div>
                        <input
                                id="search-keyword"
                                name="keyword"
                                type="text"
                                placeholder="Search contacts..."
                                class="block w-full h-10 ps-9 pe-3 bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-lg focus:ring-brand focus:border-brand shadow-xs placeholder:text-body"
                        >
                    </div>

                    <!-- Search Button -->
                    <button type="submit" class="h-10 px-4 text-white bg-blue-600 hover:bg-blue-700 dark:bg-slate-600 dark:hover:bg-slate-700 font-medium rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition cursor-pointer">
                        Search
                    </button>
                </form>

                <!-- Export Button -->
                <div class="w-full md:w-auto">
                    <button onclick="exportData()" type="button" class="w-full md:w-auto h-10 px-4 text-white bg-blue-600 hover:bg-blue-700 dark:bg-slate-600 dark:hover:bg-slate-700 font-medium rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 transition cursor-pointer">
                        Export
                    </button>
                </div>
            </div>
            <h1 class="text-2xl font-bold text-center" th:if="${contactList.isEmpty()}">No Result Found</h1>
            <table class="w-full text-sm text-left rtl:text-right text-body" th:unless="${contactList.isEmpty()}">
                <thead class="text-sm text-body bg-neutral-secondary-medium border-b border-t border-default-medium">
                <tr>
                    <th scope="col" class="px-6 py-3 font-medium">
                        Name
                    </th>
                    <th scope="col" class="px-6 py-3 font-medium">
                        Phone
                    </th>
                    <th scope="col" class="px-6 py-3 font-medium">
                        Links
                    </th>
                    <th scope="col" class="px-6 py-3 font-medium">
                        Favorite
                    </th>
                    <th scope="col" class="px-6 py-3 font-medium">
                        Action
                    </th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="contact : ${contactList.getContent()}" class="bg-neutral-primary-soft border-b border-default hover:bg-neutral-secondary-medium">
                    <th scope="row" class="flex items-center px-6 py-4 text-heading whitespace-nowrap">
                        <img class="w-10 h-10 rounded-full"
                             th:src="${contact.picture != null && !contact.picture.isEmpty()} ? ${contact.picture} : 'https://as1.ftcdn.net/v2/jpg/00/64/67/52/1000_F_64675209_7ve2XQANuzuHjMZXP3aIYIpsDKEbF5dD.jpg'"
                             alt="image">
                        <div class="ps-3">
                            <div class="text-base font-semibold" th:text="${contact.name}"></div>
                            <div class="font-normal text-body" th:text="${contact.email}"></div>
                        </div>
                    </th>
                    <td class="px-6 py-4" th:text="${contact.phoneNumber}">
                    </td>
                    <td class="px-6 py-4">
                        <div class="flex items-center gap-4">

                            <a th:href="@{${contact.socialLinks}}" target="_blank" class="flex items-center gap-1.5 text-blue-500 hover:text-blue-400 hover:underline mr-4">
                                <svg class="w-4 h-4 text-body shrink-0" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
                                     width="24" height="24" fill="none" viewBox="0 0 24 24">
                                    <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2" />
                                    <path stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                          d="M3.6 9h16.8M3.6 15h16.8" />
                                    <path stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                          d="M11.5 3a17 17 0 0 0 0 18M12.5 3a17 17 0 0 1 0 18" />
                                </svg>
                                <span>Link</span>
                            </a>


                            <a th:href="@{${contact.linkdin}}" target="_blank" class="flex items-center gap-1.5 text-blue-500 hover:text-blue-400 hover:underline">
                                <svg class="w-5 h-5 inline-block text-white me-2 shrink-0" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                    <!-- Rounded Blue Background Box -->
                                    <rect width="24" height="24" rx="4" fill="#0A66C2" />
                                    <!-- White In Logo -->
                                    <path fill="#ffffff" d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.46 8.76a1.69 1.69 0 1 0 0-3.38 1.69 1.69 0 0 0 0 3.38m1.4 9.74v-8.37H5.06v8.37z" />
                                </svg>
                                <span>LinkedIn</span>
                            </a>

                        </div>
                    </td>
                    <td class="px-6 py-4">
                        <div th:if="${contact.favorite}" class="flex items-center">
                            <div class="h-2.5 w-2.5 rounded-full bg-success me-2 mr-2"></div>Favorite
                        </div>
                        <div th:unless="${contact.favorite}" class="flex items-center">
                            <div class="h-2.5 w-2.5 rounded-full bg-danger me-2 mr-2"></div>Not Favorite
                        </div>

                    </td>
                    <td class="px-6 py-4">
                        <div class="flex items-center space-x-2">

                            <!-- 1. View Contact Button (Eye Icon) -->
                            <button th:data-id="${contact.id}" th:onclick="loadContactData(this.getAttribute('data-id'))"
                               title="View Contact"
                               class="p-2 text-blue-400 bg-blue-900/30 hover:bg-blue-600 hover:text-white rounded-lg transition-all duration-150">
                                <svg class="w-4 h-4" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                                    <path stroke="currentColor" stroke-width="2" d="M21 12c0 1.2-4.03 6-9 6s-9-4.8-9-6c0-1.2 4.03-6 9-6s9 4.8 9 6Z"/>
                                    <path stroke="currentColor" stroke-width="2" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/>
                                </svg>
                            </button>

                            <!-- 2. Edit / Update Contact Button (Pencil Icon) -->
                            <a th:href="@{'/user/contacts/view/'+${contact.id}}"
                               title="Edit Contact"
                               class="p-2 text-emerald-400 bg-emerald-900/30 hover:bg-emerald-600 hover:text-white rounded-lg transition-all duration-150">
                                <svg class="w-4 h-4" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m14.304 4.844 2.852 2.852M7 7H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1v-4.5m2.409-9.91a2.017 2.017 0 0 1 0 2.853l-6.844 6.844L8 14l.713-3.565 6.844-6.844a2.015 2.015 0 0 1 2.852 0Z"/>
                                </svg>
                            </a>

                            <!-- 3. Delete Contact Button (Trash Icon) -->
                            <button th:onclick="deleteContact([[${contact.id}]])"
                               title="Delete Contact"
                               onclick="return confirm('Are you sure you want to delete this contact?')"
                               class="p-2 text-rose-400 bg-rose-900/30 hover:bg-rose-600 hover:text-white rounded-lg transition-all duration-150">
                                <svg class="w-4 h-4" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 7h14m-9 3v8m4-8v8M10 3h4a1 1 0 0 1 1 1v3H9V4a1 1 0 0 1 1-1ZM6 7h12v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V7Z"/>
                                </svg>
                            </button>

                        </div>

                    </td>
                </tr>

                </tbody>
            </table>

            <!--            Hidden table-->
            <table id="contact_table" class="hidden w-full text-sm text-left rtl:text-right text-body" th:unless="${contactList.isEmpty()}">
                <thead class="text-sm text-body bg-neutral-secondary-medium border-b border-t border-default-medium">
                <tr>
                    <th scope="col" class="px-6 py-3 font-medium">
                        Name
                    </th>
                    <th scope="col" class="px-6 py-3 font-medium">
                        Email
                    </th>
                    <th scope="col" class="px-6 py-3 font-medium">
                        Phone
                    </th>
                    <th scope="col" class="px-6 py-3 font-medium">
                        Description
                    </th>
                    <th scope="col" class="px-6 py-3 font-medium">
                        Social Link
                    </th>
                    <th scope="col" class="px-6 py-3 font-medium">
                        LinkdIn
                    </th>
                    <th scope="col" class="px-6 py-3 font-medium">
                        Favorite or Not
                    </th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="contact : ${contactList.getContent()}" class="bg-neutral-primary-soft border-b border-default hover:bg-neutral-secondary-medium">
                    <th scope="row" class="flex items-center px-6 py-4 text-heading whitespace-nowrap">
                        <div class="ps-3">
                            <div class="text-base font-semibold" th:text="${contact.name}"></div>
                        </div>
                    </th>
                    <td class="px-6 py-4" th:text="${contact.email}">
                    </td>
                    <td class="px-6 py-4" th:text="${contact.phoneNumber}">
                    </td>
                    <td class="px-6 py-4" th:text="${contact.description}">
                    </td>
                    <td class="px-6 py-4" th:text="${contact.socialLinks}">
                    </td>
                    <td class="px-6 py-4" th:text="${contact.linkdin}">
                    </td>
                    <td class="px-6 py-4">
                        <div th:if="${contact.favorite}" class="flex items-center gap-2" th:text="'Favorite'">
                        </div>
                        <div th:unless="${contact.favorite}" class="flex items-center gap-2" th:text="'Not Favorite'">
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
            <!--            Pagination Component-->
            <div class="p-5 ">
                <nav aria-label="Page navigation example" th:if="${contactList.totalPages > 1}">
                    <ul class="flex -space-x-px text-sm">
                        <li th:unless="${contactList.isFirst()}">
                            <a  th:href="@{'/user/contacts/search?page='+${contactList.getNumber() - 1}+'&field='+${contactSearchForm.field}+'&keyword='+${contactSearchForm.keyword}}" class="flex items-center justify-center text-body bg-neutral-secondary-medium box-border border border-default-medium hover:bg-neutral-tertiary-medium hover:text-heading font-medium rounded-s-base text-sm px-3 h-10 focus:outline-none">Previous</a>
                        </li>
                        <li th:each="index : ${#numbers.sequence(0,contactList.totalPages -1)}">
                            <a
                                    th:href="@{'/user/contacts/search?page='+${index}+'&field='+${contactSearchForm.field}+'&keyword='+${contactSearchForm.keyword}}"
                                    th:classappend="${index==contactList.getNumber() ?
                                    'flex items-center justify-center text-fg-brand bg-neutral-tertiary-medium box-border border border-default-medium hover:text-fg-brand font-medium text-sm w-10 h-10 focus:outline-none'
                                    :'flex items-center justify-center text-body bg-neutral-secondary-medium box-border border border-default-medium hover:bg-neutral-tertiary-medium hover:text-heading font-medium text-sm w-10 h-10 focus:outline-none'}"
                                    class="" th:text="${index+1}"></a>
                        </li>
                        <li th:unless="${contactList.isLast()}">
                            <a th:href="@{'/user/contacts/search?page='+${contactList.getNumber() + 1}+'&field='+${contactSearchForm.field}+'&keyword='+${contactSearchForm.keyword}}" class="flex items-center justify-center text-body bg-neutral-secondary-medium box-border border border-default-medium hover:bg-neutral-tertiary-medium hover:text-heading font-medium rounded-e-base text-sm px-3 h-10 focus:outline-none">Next</a>
                        </li>
                    </ul>
                </nav>

            </div>

        </div>
        <div th:replace="~{user/contact_modal :: contact_view}">

        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/@linways/table-to-excel@1.0.4/dist/tableToExcel.min.js"></script>
    <script>
        function exportData(){
            TableToExcel.convert(document.getElementById("contact_table"), {
                name: "contacts.xlsx",
                sheet: {
                    name: "Sheet 1"
                }
            });
        }
    </script>
</section>
</body>
</html>
