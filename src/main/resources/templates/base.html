<!--    <script src="../path/to/flowbite/dist/flowbite.min.js"></script>-->
    <script src="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.js"></script>
    <script>
    const toggleBtn = document.getElementById('theme-toggle');
    const htmlElement = document.documentElement;

    // Grab the icon elements inside your button (if present)
    const lightIcon = document.getElementById('theme-toggle-light-icon');
    const darkIcon = document.getElementById('theme-toggle-dark-icon');

    // Helper function to keep button icons in sync with the current theme
    function updateIcons(isDark) {
        if (!lightIcon || !darkIcon) return;
        if (isDark) {
            lightIcon.classList.remove('hidden');
            darkIcon.classList.add('hidden');
        } else {
            lightIcon.classList.add('hidden');
            darkIcon.classList.remove('hidden');
        }
    }

    // 1. Check preference on load
    // Prioritize manual toggle preference; defaults to light mode so OS dark theme doesn't force white text
    if (localStorage.getItem('theme') === 'dark') {
        htmlElement.classList.add('dark');
        updateIcons(true);
    } else {
        htmlElement.classList.remove('dark');
        updateIcons(false);
    }

    // 2. Toggle click handler
    if (toggleBtn) {
        toggleBtn.addEventListener('click', (e) => {
            e.preventDefault();

            if (htmlElement.classList.contains('dark')) {
                htmlElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
                updateIcons(false);
                console.log("Switched to Light mode");
            } else {
                htmlElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
                updateIcons(true);
                console.log("Switched to Dark mode");
            }
        });
    }
</script>
   <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
  // Mobile Hamburger Toggle
  const menuBtn = document.getElementById('mobile-menu-toggle');
  const mobileMenu = document.getElementById('mobile-menu');

  if (menuBtn && mobileMenu) {
    menuBtn.addEventListener('click', () => {
      mobileMenu.classList.toggle('hidden');
      const expanded = menuBtn.getAttribute('aria-expanded') === 'true' || false;
      menuBtn.setAttribute('aria-expanded', !expanded);
    });
  }
</script>
</body>
